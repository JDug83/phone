<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>StandBy</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            cursor: pointer;
            -webkit-font-smoothing: antialiased;
        }

        #clock {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', system-ui, sans-serif;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum" 1;
            font-size: min(36vw, 78vh);
            line-height: 0.88;
            letter-spacing: -0.04em;
            transform: scaleY(1.08);
            white-space: nowrap;
            text-align: center;
            color: #FF2D20;
            text-shadow: 0 0 32px rgba(255, 45, 32, 0.35);
            transition: color 0.25s ease, text-shadow 0.25s ease, opacity 0.4s ease;
        }

        #clock.blue {
            color: #0A84FF;
            text-shadow: 0 0 32px rgba(10, 132, 255, 0.35);
        }

        #clock.dimmed {
            opacity: 0.15;
        }

        #colon {
            display: inline-block;
            margin: 0 -0.02em;
            transform: translateY(-0.06em);
            transition: opacity 0.25s ease;
        }

        #colon.blink {
            opacity: 0.38;
        }
    </style>
</head>
<body>

    <div id="clock"><span id="hours">10</span><span id="colon">:</span><span id="mins">49</span></div>

    <script>
        (function () {
            var clockEl = document.getElementById('clock');
            var hoursEl = document.getElementById('hours');
            var minsEl = document.getElementById('mins');
            var colonEl = document.getElementById('colon');

            var ONE_HOUR_MS = 3600000;
            var dimTimer = null;
            var lastTapTime = 0;

            // Safely update the 12-hour UK time (Europe/London) with fallback
            function updateTime() {
                var hNum = 12;
                var mStr = '00';
                var sNum = 0;
                var now = new Date();

                try {
                    var ukString = now.toLocaleTimeString('en-GB', {
                        timeZone: 'Europe/London',
                        hour12: false,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                    var parts = ukString.split(':');
                    if (parts.length >= 2) {
                        var rawH = parseInt(parts[0], 10);
                        hNum = rawH % 12 || 12;
                        mStr = parts[1].length < 2 ? '0' + parts[1] : parts[1];
                        sNum = parts[2] ? parseInt(parts[2], 10) : now.getSeconds();
                    } else {
                        throw new Error('Fallback to local Date');
                    }
                } catch (err) {
                    hNum = now.getHours() % 12 || 12;
                    var m = now.getMinutes();
                    mStr = m < 10 ? '0' + m : String(m);
                    sNum = now.getSeconds();
                }

                try {
                    var hStr = String(hNum);
                    hoursEl.textContent = hStr;
                    minsEl.textContent = mStr;

                    // Dynamically size 1-digit vs 2-digit hours so it fills the screen cleanly
                    if (hStr.length === 1) {
                        clockEl.style.fontSize = 'min(40vw, 80vh)';
                    } else {
                        clockEl.style.fontSize = 'min(33vw, 80vh)';
                    }

                    // Subtle 1-second colon pulse
                    if (sNum % 2 === 1) {
                        colonEl.classList.add('blink');
                    } else {
                        colonEl.classList.remove('blink');
                    }
                } catch (uiErr) {}
            }

            // Reset the 1-hour full brightness timer
            function resetDimTimer() {
                try {
                    if (dimTimer) clearTimeout(dimTimer);
                    dimTimer = setTimeout(function () {
                        if (clockEl) clockEl.classList.add('dimmed');
                    }, ONE_HOUR_MS);
                } catch (e) {}
            }

            // Safely request Screen Wake Lock if supported by the browser
            function requestKeepAwake() {
                try {
                    if (navigator && navigator.wakeLock && typeof navigator.wakeLock.request === 'function') {
                        navigator.wakeLock.request('screen').catch(function () {});
                    }
                } catch (e) {}
            }

            // Tap handler: wakes if dimmed, or switches between Night Red and Cool Blue
            function handleTap(e) {
                try {
                    var now = Date.now();
                    if (now - lastTapTime < 250) return; // Debounce duplicate touch/click events
                    lastTapTime = now;

                    requestKeepAwake();

                    if (clockEl.classList.contains('dimmed')) {
                        clockEl.classList.remove('dimmed');
                    } else {
                        clockEl.classList.toggle('blue');
                    }

                    resetDimTimer();
                } catch (err) {}
            }

            // Attach listeners safely
            try {
                document.body.addEventListener('pointerup', handleTap);
                document.body.addEventListener('click', handleTap);
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'visible') {
                        updateTime();
                        requestKeepAwake();
                    }
                });
            } catch (e) {}

            // Initialize immediately
            updateTime();
            resetDimTimer();
            setInterval(updateTime, 1000);
        })();
    </script>
</body>
</html>
